name: Staatsblad feed

on:
  schedule:
    - cron: "0 6 * * 1-6"   # ma-za om 06:00 UTC
  workflow_dispatch:         # handmatig starten kan ook

permissions:
  contents: write

jobs:
  bouw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python staatsblad_feed.py
      - name: Opslaan
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add feed.xml items.json
          git commit -m "Update feed" || echo "Niets nieuws"
          git push
